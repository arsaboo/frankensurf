[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frankensurf"
version = "0.39.0"
description = "One read() call for AI agents, stitched from 28 web tools: cheapest first, every page checked, a receipt for every attempt"
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "yail259" }]
requires-python = ">=3.12"
keywords = ["web scraping", "ai agents", "mcp", "browser automation", "crawler", "playwright", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "playwright>=1.63,<2", "Pillow>=12,<13", "tiktoken>=0.14,<1", "jsonschema>=4.23,<5", "pypdf>=6,<7", "cryptography>=44"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]
mcp = ["mcp>=1.2,<2"]
# Better main-content extraction (read main_content=True); a built-in extractor works without it.
main = ["trafilatura>=2,<3"]
socks = ["httpx[socks]>=0.28,<1"]

[project.urls]
Homepage = "https://frankensurf.dev"
Documentation = "https://frankensurf.dev/docs/"
Repository = "https://github.com/yail259/frankensurf"
Issues = "https://github.com/yail259/frankensurf/issues"
Changelog = "https://github.com/yail259/frankensurf/releases"

[project.scripts]
frankensurf = "frankensurf.cli:main"
frankensurf-mcp = "frankensurf.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frankensurf = ["bundled_routes.json", "bundled_route_seeds.json", "bundled_wall_priors.json", "provider_requirements.txt", "skill/SKILL.md", "searxng_settings.yml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
