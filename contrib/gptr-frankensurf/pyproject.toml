[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gptr-frankensurf"
version = "0.1.0"
description = "Frankensurf search as a GPT Researcher retriever plugin (RETRIEVER=frankensurf)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["frankensurf>=0.44", "gpt-researcher>=0.16"]

# The entry point name is what users put in RETRIEVER.
[project.entry-points."gpt_researcher.retrievers"]
frankensurf = "gptr_frankensurf:FrankensurfSearch"

[tool.setuptools.packages.find]
where = ["src"]
