[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frankensurf-plugin-example"
version = "0.1.0"
description = "An example Frankensurf provider plugin: read pages through your own scraping service"
requires-python = ">=3.12"
dependencies = ["frankensurf>=0.34", "httpx>=0.28,<1"]

# The entry point name is the plugin ID; it must match the manifest's ID.
[project.entry-points."frankensurf.plugins.provider"]
example_fetch = "frankensurf_plugin_example:ExampleFetch"

[tool.setuptools.packages.find]
where = ["src"]
