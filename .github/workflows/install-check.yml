# What a new user does, on fresh machines: install from PyPI, frankensurf install, read, start
# the MCP server. Nothing from this checkout is installed; it only supplies the
# small MCP check script. Push a branch named install-check/<anything>, or run it
# by hand with a version.
name: Install check

on:
  push:
    branches: ["install-check/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "frankensurf version on PyPI (empty: latest)"
        required: false

jobs:
  pip:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SPEC: frankensurf[mcp]${{ inputs.version && format('=={0}', inputs.version) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: pip install
        run: |
          python -m venv /tmp/fs && /tmp/fs/bin/pip install -q --upgrade pip
          # A branch named install-check/checkout-* tests this checkout before a release.
          if [[ "$GITHUB_REF_NAME" == *checkout* ]]; then /tmp/fs/bin/pip install ".[mcp]"; else /tmp/fs/bin/pip install "$SPEC"; fi
          /tmp/fs/bin/pip show frankensurf | head -2
      - name: frankensurf install (every free tool, one command)
        run: |
          /tmp/fs/bin/frankensurf install --with-deps | tee /tmp/install.json
          /tmp/fs/bin/python -c "import json,sys; r=json.load(open('/tmp/install.json')); print({k: v['ok'] for k, v in r['installed'].items()}, r.get('works_here')); sys.exit(0 if r['ok'] and all(v is True for v in r['works_here'].values()) else 1)"
          /tmp/fs/bin/frankensurf install --list
      - name: Diagnostics when install failed
        if: failure()
        run: |
          ls -l "$(/tmp/fs/bin/python -c 'import sys, os; print(os.path.realpath(sys._base_executable))')" || true
          tail -40 ~/.local/share/frankensurf/searxng-native/searxng.log || true
          lsof -nP -iTCP:8088 -sTCP:LISTEN || true
          curl -sv -m 10 "http://127.0.0.1:8088/search?q=&format=json" || true
          ps aux | grep '[s]earx' || true
          FRANKENSURF_DEBUG_WORKERS=1 /tmp/fs/bin/frankensurf read https://example.com --provider crawl4ai | tail -20 || true
      - name: The local search engine answers (no Docker)
        run: |
          # Upstream engines may refuse a data-centre address; the engine itself must answer.
          /tmp/fs/bin/frankensurf search-engine status | tee /tmp/engine.json
          /tmp/fs/bin/python -c "import json,sys; r=json.load(open('/tmp/engine.json')); sys.exit(0 if r['status'] == 'running' and r.get('engine') == 'native' else 1)"
          /tmp/fs/bin/frankensurf search "pytest github repository" --limit 3 \
            | /tmp/fs/bin/python -c "import json,sys; r=json.load(sys.stdin)['receipt']; a=[(x['source'], x['status'], x.get('failure')) for x in r['search_attempts']]; print(a); sys.exit(0 if any(s == 'searxng' and f != 'PROVIDER_DOWN' for s, _, f in a) else 1)"
      - name: frankensurf setup still works (guided install, nothing to ask in CI)
        run: /tmp/fs/bin/frankensurf setup --no-stealth | tail -5
      - name: Read a plain page
        run: /tmp/fs/bin/frankensurf read https://example.com --explain
      - name: Each browser tool on its own
        run: |
          tools="local camoufox scrapling patchright"
          [ "$RUNNER_OS" = "Linux" ] && tools="$tools crawl4ai"   # not installed on macOS yet
          for tool in $tools; do
            /tmp/fs/bin/frankensurf read https://news.ycombinator.com/ --provider "$tool" \
              | /tmp/fs/bin/python -c "import json,sys; r=json.load(sys.stdin)['receipt']; f=r.get('failure') or {}; print('$tool', r['status'], f.get('code') or '', (f.get('message') or '')[:300])"
          done
      - name: Read a script-heavy page
        run: /tmp/fs/bin/frankensurf read "https://news.ycombinator.com/" --explain | head -20
      - name: MCP server answers initialize and lists its tools
        run: /tmp/fs/bin/python scripts/install_check_mcp.py /tmp/fs/bin/frankensurf-mcp
      - name: plugins and egress check
        run: |
          /tmp/fs/bin/frankensurf plugins | head -5
          /tmp/fs/bin/frankensurf egress check

  tool-installs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SPEC: frankensurf[mcp]${{ inputs.version && format('=={0}', inputs.version) || '' }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: uv tool install
        run: |
          pip install -q uv
          uv tool install --python 3.12 "$SPEC"
          frankensurf read https://example.com --explain
      - name: pipx install
        run: |
          pip install -q pipx
          pipx install --python python3.12 "$SPEC" --suffix=-pipx
          frankensurf-pipx read https://example.com --explain
