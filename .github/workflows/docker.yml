name: Docker image

# Each release publishes ghcr.io/yail259/frankensurf:<version> and :latest, for amd64 and arm64.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the amd64 image
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name fs -p 3002:3002 -e FRANKENSURF_API_KEY=smoke --shm-size=1g "$image"
          for i in $(seq 1 30); do curl -fsS localhost:3002/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3002/v1/scrape -d '{"url":"https://example.com"}')" = 401
          curl -fsS -X POST localhost:3002/v1/scrape -H 'Authorization: Bearer smoke' \
               -H 'Content-Type: application/json' -d '{"url":"https://example.com"}' | grep -q '"success": true'
          # Agent mode is in the image; without a model it says so (400) rather than dying (500).
          docker exec fs python -c "import litellm; print('litellm', litellm.__version__)"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3002/v1/scrape -H 'Authorization: Bearer smoke' \
               -H 'Content-Type: application/json' -d '{"url":"https://example.com","formats":["summary"]}')" = 400
          docker logs fs | tail -5
